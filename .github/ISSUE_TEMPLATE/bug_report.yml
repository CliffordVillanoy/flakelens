name: Bug report
description: Something in FlakeLens does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach real test reports, secrets or personal data.** Playwright reports can hold test names, file paths, commit SHAs, error messages and stack traces from your own project.

        How to make a report safe to share:
        - Reproduce the problem with the built-in sample data (**Try sample data**) if you can.
        - Otherwise replace names, paths, URLs and SHAs with made-up values, and delete the error, stack and output text.
        - Share the smallest file that still shows the problem.

        A security problem is not a public issue. Use the [private report form](https://github.com/CliffordVillanoy/flakelens/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA you built, or the date you used the live demo.
      placeholder: "e.g. live demo, 26 Nov 2026, or commit 1a2b3c4"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome or Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version and operating system
      placeholder: "e.g. Chrome 131 on Windows 11"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: A screenshot helps. Make sure it shows no real test names or paths.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Before you send
      options:
        - label: I did not attach real reports, secrets or personal data.
          required: true
