name: ci

# Cost settings (free GitHub account): push runs only on main, so PR commits run once (via pull_request).
# Doc-only changes skip CI; docs/eval/** still runs because scripts/eval-lab.test.ts reads it.
# `paths` filters are ordered, the last match wins. To skip one commit, put [skip ci] in its message.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.impeccable/**'
      - 'docs/eval/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.impeccable/**'
      - 'docs/eval/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
