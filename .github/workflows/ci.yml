name: ci

# Cost settings (free GitHub account): push runs only on main, so PR commits run once (via pull_request).
# Doc-only changes skip CI; docs/eval/** still runs because scripts/eval-lab.test.ts reads it.
# `paths` filters are ordered, the last match wins. To skip one commit, put [skip ci] in its message.
on:
  workflow_dispatch:   # "Run workflow" button on the Actions page
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.impeccable/**'
      - 'docs/eval/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.impeccable/**'
      - 'docs/eval/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Runtime dependencies only; a known high or critical vulnerability fails CI.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # End-to-end tests (Playwright, Chromium only) cost more minutes than the checks above, so they run on pull
  # requests and by hand, not on every push to main. The pre-push hook still runs typecheck, lint and unit tests only.
  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browser download is skipped when the cache has it; the system libraries are always needed.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # DEV-49: when CI is set, playwright.config.ts retries once and writes test-results/report.json. The report is kept
      # below on every run. This repository is public, so the artifact is public: it holds test titles, repo paths,
      # durations, error text and the commit hash.
      - run: npm run e2e
      # Before anything is uploaded, remove commit author, committer, message body and absolute paths (public artifact).
      - id: scrub
        if: always()
        run: node scripts/scrub-report.ts
      # A pass that needed a retry is "flaky" in the report. List those tests so a retry never hides a problem.
      - if: always()
        run: node scripts/flaky-summary.ts
      # Only a scrubbed report is uploaded: if the scrub failed, nothing is.
      - if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-results/report.json
          if-no-files-found: warn
          retention-days: 90

