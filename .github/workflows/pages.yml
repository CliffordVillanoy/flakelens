name: pages

# Publishes the built app to GitHub Pages at https://cliffordvillanoy.github.io/flakelens/.
# Needs Pages switched on first: repository Settings > Pages > Source: GitHub Actions.
# Same path filters as ci.yml: doc-only changes do not redeploy (docs/eval/** does not change the app either,
# but it is kept the same so the two workflows stay easy to compare).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.impeccable/**'
      - 'docs/eval/**'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs: with both in one job, deploy-pages looked for the artifact about 2 seconds
  # after the upload and sometimes found none ("Found 0 artifact(s)"). The job boundary gives it time to appear.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write to Pages and request the OIDC token the deployment needs.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
