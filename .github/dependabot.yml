# Weekly, grouped updates: one pull request per ecosystem per week keeps CI minutes low on a free account.
# The group carries minor and patch updates only; a major update comes as its own single PR, so one hard major
# cannot block the rest. github-actions keeps the commit SHA pins in workflows and updates the "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint (8.x) allows typescript below 6.1 only, so npm ci fails with ERESOLVE on TypeScript 7
      # (Dependabot PR #1). Remove this rule once typescript-eslint supports TypeScript 7; the migration needs its own ticket.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
