# Weekly, grouped updates: one pull request per ecosystem per week keeps CI minutes low on a free account.
# github-actions keeps the commit SHA pins in workflows and updates the "# vX.Y.Z" comment next to them.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
